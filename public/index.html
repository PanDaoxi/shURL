    <form id="form" class="flex items-center justify-center w-1/2 bg-white rounded-full shadow-xl">
        <input id="url" type="text" placeholder="输入长链接…"
            class="w-full px-4 py-2 rounded-l-full outline-none bg-transparent">
        <button type="submit"
            class="flex items-center justify-center px-4 py-2 text-white bg-emerald-700 rounded-r-full hover:bg-emerald-900 focus:outline-none">
            <b>Go!</b>
        </button>
    </form>

    <p id="result" class="mt-4 font-bold"></p>

    <p id="newURL" class="mt-2">
        <a class="text-teal-500 hover:text-teal-600" href="https://blog.daoxi365.top/posts/43801/">
            <b>帮助文档：我也想创建一个这样的网站。</b>
        </a>
    </p>

    <script src="./js/app.js"></script>
    <script>
        (function() {
            const form = document.getElementById('form');
            const resultEl = document.getElementById('result');
            const website = window.location.origin;

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const urlInput = document.getElementById('url');
                const rawUrl = urlInput.value.trim();
                if (!rawUrl) {
                    resultEl.textContent = '请输入链接';
                    return;
                }
                resultEl.innerHTML = '生成中…';

                try {
                    const res = await fetch('/api/shorten', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url: rawUrl })
                    });
                    const data = await res.json();
                    if (data.code) {
                        const shortUrl = website + '/' + data.code;
                        resultEl.innerHTML = '<a href="' + shortUrl + '" class="text-blue-700 hover:underline">' + shortUrl + '</a>';
                    } else {
                        resultEl.textContent = '生成失败：' + (data.error || '未知错误');
                    }
                } catch (err) {
                    resultEl.textContent = '请求失败，请检查网络';
                }
            });
        })();
    </script>
